version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: fixlane-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fixlane}
      POSTGRES_USER: ${POSTGRES_USER:-fixlane}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fixlane-backend
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-fixlane}
      DB_USER: ${POSTGRES_USER:-fixlane}
      DB_PASS: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      INVITED_DEFAULT_PASSWORD: ${INVITED_DEFAULT_PASSWORD:?INVITED_DEFAULT_PASSWORD is required}
    ports:
      - "8080:8080"
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fixlane-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
