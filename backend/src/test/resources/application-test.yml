spring:
  datasource:
    url: jdbc:tc:postgresql:16-alpine:///fixlane_test
    username: ${TEST_DB_USER:test}
    password: ${TEST_DB_PASS:test}
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
