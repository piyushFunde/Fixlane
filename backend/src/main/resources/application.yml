spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/fixlane}
    username: ${DB_USER:fixlane}
    password: ${DB_PASS:fixlane}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true

app:
  jwt:
    secret: ${JWT_SECRET:changeme-at-least-32-chars-long!!!}
    access-expiry-ms: 900000
    refresh-expiry-ms: 604800000
  cors:
    allowed-origins: ${CORS_ORIGIN:http://localhost:5173}

server:
  port: 8080
